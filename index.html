<script>
  window.addEventListener('error', function(e) {
    fetch('http://localhost:4000/?err=' + encodeURIComponent(e.message + ' at ' + e.filename + ':' + e.lineno));
  });
  window.addEventListener('unhandledrejection', function(e) {
    fetch('http://localhost:4000/?err=' + encodeURIComponent('Promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));
  });
</script>
